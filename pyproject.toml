[project]
name = "agis"
version = "0.1.0"
description = "A lightweight, local-first natural-language CLI for simple GIS tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Peter Menzies" }]
keywords = ["gis", "geospatial", "llm", "agent", "ollama", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "ollama>=0.4",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "morecantile>=6.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agis = "agis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
